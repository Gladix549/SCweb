<script>
/* =========================================
   SCweb – Download popup + Google Analytics
   ========================================= */

(function () {

    const POPUP_STORAGE_KEY = "scweb_download_popup_last_shown";
    const POPUP_COOLDOWN = 0;

    const popup = document.getElementById("scwebDownloadPopup");
    const closeButton = document.getElementById("scwebPopupClose");
    const laterButton = document.getElementById("scwebPopupLater");
    const shareButton = document.getElementById("scwebShareButton");
    const donateButton = document.getElementById("scwebDonateButton");


    /* =========================================
       Google Analytics helper
       ========================================= */

    function sendAnalyticsEvent(eventName, parameters = {}) {

        if (typeof window.gtag === "function") {

            window.gtag("event", eventName, parameters);

        } else {

            console.warn(
                "SCweb: Google Analytics (gtag) nebyl nalezen."
            );

        }
    }


    /* =========================================
       Zjištění, zda může být popup zobrazen
       ========================================= */

    function canShowPopup() {

        try {

            const lastShown = localStorage.getItem(
                POPUP_STORAGE_KEY
            );

            if (!lastShown) {
                return true;
            }

            const timeSinceLastPopup =
                Date.now() - Number(lastShown);

            return timeSinceLastPopup >= POPUP_COOLDOWN;

        } catch (error) {

            // Pokud localStorage není dostupné,
            // popup raději zobrazíme.
            return true;
        }
    }


    /* =========================================
       Zobrazení popupu
       ========================================= */

    function showPopup() {

        if (!popup) {
            return;
        }

        if (!canShowPopup()) {
            return;
        }

        popup.classList.add("scweb-popup-visible");
        popup.setAttribute("aria-hidden", "false");

        try {

            localStorage.setItem(
                POPUP_STORAGE_KEY,
                Date.now().toString()
            );

        } catch (error) {
            // Nic se neděje.
        }

        sendAnalyticsEvent("download_popup_view", {
            popup_type: "download_support"
        });
    }


    /* =========================================
       Zavření popupu
       ========================================= */

    function closePopup() {

        if (!popup) {
            return;
        }

        popup.classList.remove("scweb-popup-visible");
        popup.setAttribute("aria-hidden", "true");
    }


    /* =========================================
       Sdílení SCwebu
       ========================================= */

    async function shareSCweb() {

        const shareData = {
            title: "SCweb",
            text: "Mrkni na SCweb – web s materiály pro studenty!",
            url: "https://scweb.cz"
        };


        /* -------------------------------------
           Mobil / prohlížeče s Web Share API
           ------------------------------------- */

        if (
            navigator.share &&
            typeof navigator.share === "function"
        ) {

            try {

                await navigator.share(shareData);

                sendAnalyticsEvent("share_click", {
                    share_method: "native_share"
                });

                closePopup();

                return;

            } catch (error) {

                // Uživatel mohl sdílení jen zrušit.
                // V takovém případě popup nezavíráme.
                if (error && error.name === "AbortError") {
                    return;
                }

                console.warn(
                    "SCweb: Native share se nepodařilo použít.",
                    error
                );
            }
        }


        /* -------------------------------------
           PC / fallback → zkopírování odkazu
           ------------------------------------- */

        try {

            await navigator.clipboard.writeText(
                "https://scweb.cz"
            );

            sendAnalyticsEvent("share_click", {
                share_method: "copy_link"
            });

            alert(
                "Odkaz byl zkopírován do schránky."
            );

            closePopup();

        } catch (error) {

            console.error(
                "SCweb: Nepodařilo se zkopírovat odkaz.",
                error
            );

            alert(
                "Odkaz na SCweb: https://scweb.cz"
            );
        }
    }


    /* =========================================
       Download odkazy
       ========================================= */

    const downloadLinks = document.querySelectorAll(
        'a[href*="docs.google.com/document"][href*="/export"]'
    );


    downloadLinks.forEach(function (link) {

        link.addEventListener("click", function () {

            /*
             * Získáme název dokumentu z textu odkazu.
             * Např. "Pohybová (svalová) soustava ✍️"
             */

            const documentName =
                link.textContent.trim();


            /* -------------------------------
               GA4 – download event
               ------------------------------- */

            sendAnalyticsEvent("download", {

                file_name: documentName,

                file_type: "docx",

                link_url: link.href

            });


            /* -------------------------------
               Popup
               ------------------------------- */

            /*
             * Krátké zpoždění zajistí, že se
             * nejdřív spustí odkaz na Google Docs
             * a až potom popup.
             */

            setTimeout(function () {

                showPopup();

            }, 1000);

        });

    });


    /* =========================================
       Tlačítka popupu
       ========================================= */

    if (closeButton) {

        closeButton.addEventListener(
            "click",
            closePopup
        );

    }


    if (laterButton) {

        laterButton.addEventListener(
            "click",
            closePopup
        );

    }


    if (shareButton) {

        shareButton.addEventListener(
            "click",
            shareSCweb
        );

    }


    if (donateButton) {

        donateButton.addEventListener(
            "click",
            function () {

                sendAnalyticsEvent("donate_click", {

                    link_url: donateButton.href

                });

            }
        );

    }


    /* =========================================
       Kliknutí mimo popup → zavření
       ========================================= */

    if (popup) {

        popup.addEventListener(
            "click",
            function (event) {

                if (event.target === popup) {
                    closePopup();
                }

            }
        );

    }


    /* =========================================
       ESC → zavření
       ========================================= */

    document.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Escape") {
                closePopup();
            }

        }
    );

})();
</script>
